<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#090909"/>
    <stop offset="45%" stop-color="#210708"/>
    <stop offset="100%" stop-color="#5b090d"/>
  </linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#090909"/>
    <stop offset="100%" stop-color="#180506"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="1600" height="420" fill="url(#bg)"/>
<circle cx="1280" cy="110" r="210" fill="#b3131b" opacity=".09"/>
<circle cx="340" cy="300" r="260" fill="#ef1520" opacity=".07"/>

